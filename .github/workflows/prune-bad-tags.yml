name: Prune Broken Tags

# 一次性清理：删除公开包里"只有 index、实际拉不下来"的坏标签。
#
# 背景：迁移时只把多架构 index 推到了新包，子 manifest 从未上传，
# 导致 docker pull 在"取子 manifest"那步 404。标签看着在，实际拉不动。
# 对应的源码 commit 都在私有仓库里，需要时随时可重建。

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "真正执行删除（不加则只干跑报告）"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper scripts
        uses: actions/checkout@v4
        with:
          path: self

      - name: Prune broken tags
        working-directory: self
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if [ "${{ inputs.apply }}" = "true" ]; then
            python3 scripts/prune_broken_tags.py --apply
          else
            python3 scripts/prune_broken_tags.py
          fi
