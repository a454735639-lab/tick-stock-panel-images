name: Cleanup Probe Packages

# 一次性清理：删除迁移过程中产生的探测包。
#
# 背景：把私有包迁到公开新包名时，为了验证 GHCR 的几条机制，
# 曾经建过几个临时包。这些包现在没用了，要清掉。
#
# 注意：删除包需要 packages:write 且能删自己仓库关联的包。
# 本地 PAT 缺 read:packages / write:packages scope，所以只能走 CI 的
# GITHUB_TOKEN 来删。
#
# 本 workflow 幂等：包不存在时静默跳过。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-probes.yml'

permissions:
  contents: read
  packages: write

env:
  OWNER: a454735639-lab

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete probe packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          PROBES="tick-stock-panel-drill probe-renamed-target tick-stock-panel-1793852631 tick-stock-panel-src probe-id-test tick-stock-panel-backup-probe"
          for P in $PROBES; do
            # 先删 versions，再删包本身
            C1=$(curl -s -o /tmp/d1.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/${OWNER}/packages/container/${P}/versions?per_page=100")
            C2=$(curl -s -o /tmp/d2.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/packages/container/${P}")
            echo "  ${P}: versions=${C1} package=${C2}"
          done
