name: Purge Package Name

# 清理被"已删除但仍占用"的包名。
#
# 现象：GHCR 的包一旦创建过，删除后 30 天内名字仍被保留（可 restore），
#      且仍归属原关联仓库 => 别的仓库的令牌对它 write_package 被拒。
#      全新包名则完全正常（已实测）。
#
# 本 workflow：
#   1. restore 旧包（若有）
#   2. 删除所有 version
#   3. 删除包本体
#   4. 再次 restore，确认它是否真的进入"永久删除"状态
#      （连续删两次后，名字应该会真正释放）
#
# 目标包: tick-stock-panel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge.yml'

env:
  REGISTRY: ghcr.io
  OWNER: a454735639-lab
  PKG: tick-stock-panel

jobs:
  purge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Purge loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.github.com"
          H=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          status() {
            code=$(curl -s -o /tmp/s.json -w '%{http_code}' "${H[@]}" \
              "${API}/users/${OWNER}/packages/container/${PKG}")
            echo "  GET package -> ${code}"
            [ "$code" = "200" ] && python3 -c "
          import json
          d=json.load(open('/tmp/s.json'))
          print('    name:',d.get('name'),'| visibility:',d.get('visibility'),'| repo:',(d.get('repository') or {}).get('full_name'))
          "
            return 0
          }

          echo "=== round 1: status ==="
          status

          echo "=== round 1: restore ==="
          code=$(curl -s -o /tmp/r1.json -w '%{http_code}' -X POST "${H[@]}" \
            "${API}/users/${OWNER}/packages/container/${PKG}/restore")
          echo "  restore -> ${code}"
          head -c 200 /tmp/r1.json; echo
          sleep 5

          echo "=== round 1: status after restore ==="
          status

          echo "=== round 1: delete versions ==="
          code=$(curl -s -o /tmp/dv.json -w '%{http_code}' -X DELETE "${H[@]}" \
            "${API}/users/${OWNER}/packages/container/${PKG}/versions?per_page=100")
          echo "  delete versions -> ${code}"
          sleep 3

          echo "=== round 1: delete package ==="
          code=$(curl -s -o /tmp/dp.json -w '%{http_code}' -X DELETE "${H[@]}" \
            "${API}/users/${OWNER}/packages/container/${PKG}")
          echo "  delete package -> ${code}"
          head -c 200 /tmp/dp.json; echo
          sleep 5

          echo "=== round 1: final status ==="
          status

          echo "=== round 2: delete again (name should now be released) ==="
          code=$(curl -s -o /tmp/dp2.json -w '%{http_code}' -X DELETE "${H[@]}" \
            "${API}/users/${OWNER}/packages/container/${PKG}")
          echo "  delete package (2nd) -> ${code}"
          head -c 200 /tmp/dp2.json; echo
          sleep 3

          echo "=== final status ==="
          status

      - name: Probe registry write with a fresh package name (control)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # 对照组：全新包名应能写
          NEW="tick-stock-panel-$(date +%s)"
          PKG="${OWNER}/${NEW}"
          TOK=$(curl -sf -u "probe:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${PKG}:pull,push&service=ghcr.io" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('token',''))")
          export TOK
          [ -z "$TOK" ] && { echo "NO_TOKEN"; exit 0; }
          echo '{"schemaVersion":2,"mediaType":"application/vnd.oci.image.index.v1+json","manifests":[]}' > /tmp/i.json
          CODE=$(curl -s -o /tmp/p.out -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${TOK}" \
            -H "Content-Type: application/vnd.oci.image.index.v1+json" \
            --data-binary @/tmp/i.json \
            "https://ghcr.io/v2/${PKG}/manifests/probe")
          echo "control PUT to fresh name ${NEW} -> ${CODE}"
          head -c 200 /tmp/p.out; echo

          # 目标包名再试一次
          PKG2="${OWNER}/tick-stock-panel"
          TOK2=$(curl -sf -u "probe:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${PKG2}:pull,push&service=ghcr.io" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('token',''))")
          export TOK2
          if [ -z "$TOK2" ]; then echo "target: NO_TOKEN"; exit 0; fi
          CODE2=$(curl -s -o /tmp/p2.out -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${TOK2}" \
            -H "Content-Type: application/vnd.oci.image.index.v1+json" \
            --data-binary @/tmp/i.json \
            "https://ghcr.io/v2/${PKG2}/manifests/probe")
          echo "target PUT -> ${CODE2}"
          head -c 200 /tmp/p2.out; echo
