name: Publish Public Package

# 把镜像发布到公开包 ghcr.io/a454735639-lab/tick-stock-panel-images
#
# 背景（全部为实测结论）：
#   - GHCR 包的可见性在"首次创建"时继承创建它的仓库：
#     私有仓库首推 = PRIVATE，公开仓库首推 = PUBLIC。
#   - 已存在的包不会跟随仓库可见性翻转；REST/GraphQL 都没有改可见性的端点。
#   - 包的推送权跟随"创建它的仓库"：别的仓库的令牌推不进去
#     （write_package denied）。
#   - 包名一旦被用过，即使删除，名字仍被占用（最长 30 天可 restore），
#     期间别的仓库无法接管 —— 所以本次用新包名 tick-stock-panel-images。
#
# 镜像内容的来源：备份的 manifest（含每个 tag 的 digest 与架构）。
# GHCR 的 blob 按 digest 全局去重，因此可以直接把 manifest 原样 PUT 回去，
# 不需要重新构建（已验证 27/27 恢复成功）。
#
# 本 workflow 幂等：可重复运行。
#
# 注意：所有 Python 逻辑都放在 scripts/publish_public.py 里，
# 避免在 YAML block scalar 里内嵌多行 Python 造成缩进错误。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-public.yml'
      - 'scripts/publish_public.py'
      - 'backup/manifests.json'

env:
  REGISTRY: ghcr.io
  OWNER: a454735639-lab
  PKG: tick-stock-panel-images

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo (manifest backup + helper scripts)
        uses: actions/checkout@v4
        with:
          path: self

      - name: Check manifest backup
        run: |
          set -euo pipefail
          ls -la self/backup/manifests.json
          python3 -c "import json;d=json.load(open('self/backup/manifests.json',encoding='utf-8'));print('manifests to publish:',len(d));assert len(d)>0"

      - name: Publish manifests and verify anonymous pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: self
        run: |
          set -euo pipefail
          python3 scripts/publish_public.py

      - name: Upload publish result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-result
          path: self/publish_result.json
