name: Publish Public Package

# 把备份的 manifest 发布到公开包 ghcr.io/a454735639-lab/tick-stock-panel-images
#
# ⚠️ 本 workflow 的能力边界（实测教训）
# ------------------------------------
# 多架构镜像在 registry 里有两层：index(manifest list) + 各自的子 manifest。
# 备份文件 backup/manifests.json 里只有 index 层，
# **子 manifest 的 body 不在其中**（只有 digest 引用）。
#
# 所以本 workflow 只能发布 index 层，
# **发布后镜像仍不可拉取**（docker 取子 manifest 会 404）。
#
# 实测事故：曾用本 workflow 发布 27 个标签，
# "GET manifest by tag" 全部 200，看着一切正常，
# 但 docker pull 在"取子 manifest"这步必然失败。
#
# ⇒ **发布可用镜像请用 rebuild-images.yml**（从私有源码重建，
#    buildx 会把 index、子 manifest、config、各层 blob 一并推上去）。
#
# 本 workflow 保留用于：恢复 index 层清单 / 核对标签是否存在。
# 它的验证步骤已改为**完整拉取链路**校验，会如实报出"子 manifest 缺失"，
# 不再给出误导性的"全部通过"。
#
# 其它实测结论（GHCR）：
#   - 包的可见性在"首次创建"时继承创建它的仓库：
#     私有仓库首推 = PRIVATE，公开仓库首推 = PUBLIC。
#   - 已存在的包不会跟随仓库可见性翻转；REST/GraphQL 都没有改可见性的端点。
#   - 包的推送权跟随"创建它的仓库"：别的仓库的令牌推不进去
#     （write_package denied）。
#   - 包名一旦被用过，即使删除，名字仍被占用（最长 30 天可 restore），
#     期间别的仓库无法接管 —— 所以本次用新包名 tick-stock-panel-images。
#
# 注意：所有 Python 逻辑都放在 scripts/ 下，
# 避免在 YAML block scalar 里内嵌多行 Python 造成缩进错误。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-public.yml'
      - 'scripts/publish_public.py'
      - 'backup/manifests.json'

env:
  REGISTRY: ghcr.io
  OWNER: a454735639-lab
  PKG: tick-stock-panel-images

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo (manifest backup + helper scripts)
        uses: actions/checkout@v4
        with:
          path: self

      - name: Check manifest backup
        run: |
          set -euo pipefail
          ls -la self/backup/manifests.json
          python3 -c "import json;d=json.load(open('self/backup/manifests.json',encoding='utf-8'));print('manifests to publish:',len(d));assert len(d)>0"

      - name: Publish manifests and verify anonymous pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: self
        run: |
          set -euo pipefail
          python3 scripts/publish_public.py

      # 完整链路校验：index → 子 manifest → config → 各层 blob
      # 匿名执行，验证的是"任何人不用登录能不能拉"。
      - name: Verify full anonymous pull chain
        working-directory: self
        env:
          GH_TOKEN: ""
        run: |
          set -uo pipefail
          python3 scripts/verify_pullable.py fused-v0.3.29 fused-latest latest || \
            echo "::warning::完整拉取链路未通过 —— index 已发布但子 manifest 缺失，需用 rebuild-images.yml 重建镜像"

      - name: Upload publish result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-result
          path: self/publish_result.json
