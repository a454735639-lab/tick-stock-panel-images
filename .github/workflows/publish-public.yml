name: Publish Public Package

# 把镜像发布到公开包 ghcr.io/a454735639-lab/tick-stock-panel-images
#
# 背景（全部为实测结论）：
#   - GHCR 包的可见性在"首次创建"时继承创建它的仓库：
#     私有仓库首推 = PRIVATE，公开仓库首推 = PUBLIC。
#   - 已存在的包不会跟随仓库可见性翻转；REST/GraphQL 都没有改可见性的端点。
#   - 包的推送权跟随"创建它的仓库"：别的仓库的令牌推不进去
#     （write_package denied）。
#   - 包名一旦被用过，即使删除，名字仍被占用（最长 30 天可 restore），
#     期间别的仓库无法接管 —— 所以本次用新包名 tick-stock-panel-images。
#
# 镜像内容的来源：备份的 manifest（含每个 tag 的 digest 与架构）。
# GHCR 的 blob 按 digest 全局去重，因此可以直接把 manifest 原样 PUT 回去，
# 不需要重新构建（已验证 27/27 恢复成功）。
#
# 本 workflow 幂等：可重复运行。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-public.yml'

env:
  REGISTRY: ghcr.io
  OWNER: a454735639-lab
  PKG: tick-stock-panel-images

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo (manifest backup + helper scripts)
        uses: actions/checkout@v4
        with:
          path: self

      - name: Check manifest backup
        run: |
          set -euo pipefail
          ls -la self/backup/manifests.json
          python3 -c "
          import json
          d=json.load(open('self/backup/manifests.json',encoding='utf-8'))
          print('manifests to publish:',len(d))
          assert len(d)>0, 'empty backup'
          "

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          PKG="${OWNER}/${PKG}"
          export PKG
          TOK=$(curl -sf -u "probe:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${PKG}:pull,push&service=ghcr.io" \
            | python3 scripts/anon_token.py)
          export TOK
          echo "token_len=${#TOK}"
          if [ -z "$TOK" ]; then echo "NO_TOKEN"; exit 1; fi

          python3 - <<'PY'
          import json, subprocess, os
          pkg = os.environ["PKG"]
          tok = os.environ["TOK"]
          mans = json.load(open("self/backup/manifests.json", encoding="utf-8"))
          ok, fail = 0, []
          for rec in mans:
              tag = rec["tag"]
              body = rec.get("manifest")
              mt = rec.get("mediaType") or "application/vnd.oci.image.index.v1+json"
              if not body:
                  fail.append((tag, "no manifest body"))
                  continue
              data = json.dumps(body).encode()
              p = subprocess.run(
                  ["curl","-s","-o","/tmp/put.out","-w","%{http_code}",
                   "-X","PUT",
                   "-H",f"Authorization: Bearer {tok}",
                   "-H",f"Content-Type: {mt}",
                   "--data-binary","@-",
                   f"https://ghcr.io/v2/{pkg}/manifests/{tag}"],
                  input=data.decode(), capture_output=True, text=True)
              code = p.stdout.strip()
              if code == "201":
                  ok += 1
                  print(f"  OK   {tag}")
              else:
                  err = open("/tmp/put.out", encoding="utf-8", errors="replace").read()[:220]
                  fail.append((tag, f"{code} {err}"))
                  print(f"  FAIL {tag} {code} {err}")
          print(f"\nPUBLISHED {ok}/{len(mans)}")
          for t, e in fail[:10]:
              print("  -", t, e)
          json.dump({"published": ok, "total": len(mans),
                     "failures": [{"tag": t, "error": e} for t, e in fail]},
                    open("publish_result.json","w",encoding="utf-8"),
                    ensure_ascii=False, indent=1)
          if fail:
              raise SystemExit(1)
          PY

      - name: Verify anonymous pull
        run: |
          set -uo pipefail
          PKG="${OWNER}/${PKG}"
          BODY=$(curl -s "https://ghcr.io/token?scope=repository:${PKG}:pull&service=ghcr.io")
          TOK=$(printf '%s' "$BODY" | python3 scripts/anon_token.py)
          if [ -z "$TOK" ]; then
            echo "ANON_TOKEN_DENIED -- package is NOT public"
            exit 1
          fi
          echo "ANON_TOKEN_OK -> package is PUBLIC"
          curl -s -H "Authorization: Bearer ${TOK}" "https://ghcr.io/v2/${PKG}/tags/list?n=1000" > /tmp/t.json
          python3 -c "
          import json
          t=json.load(open('/tmp/t.json',encoding='utf-8')).get('tags') or []
          print('tags visible anonymously:',len(t))
          print(sorted(t))
          assert 'fused-v0.3.29' in t, 'production tag missing'
          assert 'fused-latest' in t, 'fused-latest missing'
          assert 'latest' in t, 'latest missing'
          print('CRITICAL TAGS PRESENT')
          "
          for TAG in fused-v0.3.29 fused-latest latest; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOK}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/${PKG}/manifests/${TAG}")
            echo "  manifest ${TAG}: HTTP ${CODE}"
            [ "$CODE" = "200" ] || exit 1
          done

      - name: Upload publish result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-result
          path: publish_result.json
