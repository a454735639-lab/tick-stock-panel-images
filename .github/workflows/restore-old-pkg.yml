name: Restore Old Package

# 一次性救援：恢复 30 天内被删除的旧私有包 tick-stock-panel。
#
# 背景：迁移到公开包 tick-stock-panel-images 时，publish_public.py 只 PUT 了
# 多架构 index（manifest list），4 个子 manifest（amd64/arm64 + 2 个 attestation）
# 从未上传，导致 docker pull 在"取子 manifest"这一步 404。
#
# GitHub 允许在删除后 30 天内 restore 整个包（前提：命名空间未被复用）。
# 旧包是今天才删的，还有救。
#
# 本 workflow 只做诊断 + restore，不删除任何东西。

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper scripts
        uses: actions/checkout@v4
        with:
          path: self

      - name: Restore and report
        working-directory: self
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/restore_old_pkg.py
