name: Cleanup Smoke Tag
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete smoke tag versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          P=tick-stock-panel-images
          curl -s -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/a454735639-lab/packages/container/${P}/versions?per_page=100" > /tmp/vs.json
          python3 -c "
          import json
          d=json.load(open('/tmp/vs.json',encoding='utf-8'))
          if isinstance(d,dict):
              print('ERR',d.get('message')); raise SystemExit(0)
          for v in d:
              tags=((v.get('metadata') or {}).get('container',{}) or {}).get('tags') or []
              print('VER',v.get('id'),tags)
          "
          # 删掉带 smoke- 前缀的 tag 对应的 version
          python3 -c "
          import json
          d=json.load(open('/tmp/vs.json',encoding='utf-8'))
          ids=[]
          for v in d:
              tags=((v.get('metadata') or {}).get('container',{}) or {}).get('tags') or []
              if any(t.startswith('smoke-') for t in tags):
                  ids.append(v['id'])
          print(' '.join(str(i) for i in ids))
          " > /tmp/ids.txt
          for VID in $(cat /tmp/ids.txt); do
            C=$(curl -s -o /tmp/v.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/a454735639-lab/packages/container/${P}/versions/${VID}")
            echo "delete version ${VID} -> ${C}"
            cat /tmp/v.json; echo
          done
